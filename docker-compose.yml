networks:
  dev:


services:
  backend:
    build: ./backend
    container_name: django_app
    restart: always
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - dev


  frontend:
    build: ./frontend
    container_name: vite_app
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dev

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - dev
volumes:
  static_volume:
  media_volume:
