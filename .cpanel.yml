---
deployment:
  tasks:
    # Указываем пути развертывания
    - export BACKEND_PATH=/home/mysitete/dental/backend
    - export FRONTEND_PATH=/home/mysitete/dental/frontend
    - export PUBLIC_HTML=/home/mysitete/public_html

    # 1️⃣ Создаём папки, если их нет
    - mkdir -p $BACKEND_PATH $FRONTEND_PATH

    # 2️⃣ Удаляем старые файлы
    - rm -rf $BACKEND_PATH/* $FRONTEND_PATH/*

    # 3️⃣ Копируем файлы из репозитория
    - cp -R backend/* $BACKEND_PATH/
    - cp -R frontend/* $FRONTEND_PATH/

    # 4️⃣ Настраиваем виртуальное окружение для Django
    - cd $BACKEND_PATH
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - python manage.py migrate
    - python manage.py collectstatic --noinput

    # 5️⃣ Собираем фронтенд (Vite)
    - cd $FRONTEND_PATH
    - npm install
    - npm run build
    - cp -R dist/* $PUBLIC_HTML/
