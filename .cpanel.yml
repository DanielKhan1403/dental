---
deployment:
  tasks:
    # Указываем путь, куда деплоить (замени `username` на свой логин в cPanel)
    - export BACKEND_PATH=/home/mysitete/backend
    - export FRONTEND_PATH=/home/mysitete/frontend
    - export PUBLIC_HTML=/home/mysitete/public_html

    # 1️⃣ Удаляем старые файлы (чтобы не было мусора)
    - rm -rf $BACKEND_PATH $FRONTEND_PATH

    # 2️⃣ Копируем файлы из Git
    - mkdir -p $BACKEND_PATH $FRONTEND_PATH
    - cp -R backend/* $BACKEND_PATH/
    - cp -R frontend/* $FRONTEND_PATH/

    # 3️⃣ Настраиваем виртуальное окружение для Django
    - cd $BACKEND_PATH
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - python manage.py migrate
    - python manage.py collectstatic --noinput

    # 4️⃣ Собираем фронтенд (Vite)
    - cd $FRONTEND_PATH
    - npm install
    - npm run build
    - cp -R dist/* $PUBLIC_HTML/
